# Test profile: H2 in PostgreSQL compatibility mode so the same Flyway
# migrations run in tests without a live PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hs256-alg-123456
  stripe:
    enabled: false
