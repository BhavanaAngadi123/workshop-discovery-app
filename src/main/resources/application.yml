server:
  port: 8080

spring:
  application:
    name: workshop-discovery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshops}
    username: ${DB_USER:workshops}
    password: ${DB_PASSWORD:workshops}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.1:8b}
        options:
          temperature: 0.7

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-use-env-APP_JWT_SECRET-32chars!}
    ttl-ms: 86400000
  posters:
    dir: ${APP_POSTERS_DIR:posters}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

vaadin:
  productionMode: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
